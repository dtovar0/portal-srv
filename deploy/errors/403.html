<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="portal-domain" content="aduana.vivaro.com">
  <meta name="portal-title" content="ADUANA">
  <title>Sin Acceso — ADUANA</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/errors/assets/brand/icon-32.png">
  <link rel="stylesheet" href="/errors/assets/css/error.css">
  <script src="/errors/assets/js/error.js" defer></script>
</head>
<body>
  <div class="error-layout">
    <div class="glow-cyan" aria-hidden="true"></div>
    <div class="glow-orange" aria-hidden="true"></div>

    <main class="error-card" role="main">
      <div class="brand-header">
        <img src="/errors/assets/brand/isotype-aduana.png" alt="Aduana" class="brand-mini-logo">
        <span class="brand-mini-title">ADUANA · Control de Acceso</span>
      </div>

      <div class="platform-badge" aria-hidden="true">
        <img data-plataforma-icono src="" alt="" class="platform-icon hidden">
        <span data-plataforma-iniciales class="platform-initials">PL</span>
      </div>

      <div>
        <span class="status-pill status-danger">
          <span class="status-dot"></span>
          403 · SIN ACCESO
        </span>
      </div>

      <h1 class="error-title" data-plataforma-nombre>Plataforma solicitada</h1>
      <p class="error-desc">
        No tienes acceso al recurso solicitado. Tienes que pedir acceso a tu administrador para ingresar.
      </p>

      <div class="actions-group">
        <a href="/platforms" class="btn-primary" data-link-aduana>
          Solicitar acceso en ADUANA
        </a>
      </div>
    </main>

    <footer class="error-footer" role="contentinfo">
      <span class="error-footer-brand">ADUANA</span> · Gestión Centralizada de Permisos
    </footer>
  </div>
</body>
</html>
